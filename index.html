<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <div class="todo-container">
        <div class="yellow-bar"></div>
        <div class="header">
            <h1>To-Do list</h1>
            <img id="sort-btn" src="/sortfromtoptobottom.png" class="sort-btn">
        </div>
        <ul id="todo-list">
            <li>
                <input type="text" class="todo-input" >
                <img  class="delete-btn" src="./remove.png">
           
            </li>
        </ul>
        <div class="plusconatiner">
            <img class="plusicon" src="/plus.png" >
        </div>
        <button id="add-btn" class="add-btn">Add</button>
    </div>
    <script src="todo.js"></script>
</body>
</html>
